<body>

<div class="container">

    <nav class="site-nav" aria-label="Primary">
      <div class="site-nav-left">
        <a class="site-nav-brand" href="/index.html">ReelVotes</a>
      </div>
      <div class="site-nav-center" aria-label="Core navigation">
        <a class="site-nav-tab active" href="/select-event.html">Showtimes</a>
        <a class="site-nav-tab" href="/suggest">Suggest a Movie</a>
        <a class="site-nav-tab" href="/how-it-works">How It Works</a>
      </div>
      <div class="site-nav-right">
        <a class="site-nav-cta" href="/email-signup.html">Join Email List</a>
        <details class="site-nav-profile">
          <summary aria-label="Open profile menu">⚙</summary>
          <div class="site-nav-dropdown" role="menu">
            <a href="/reelsuccess.html" role="menuitem">ReelSuccess</a>
            <a href="/admin.html" role="menuitem">Admin View</a>
          </div>
        </details>
      </div>
      <button id="navToggleBtn" class="nav-toggle" type="button" aria-label="Toggle navigation">☰</button>
      <div id="siteNavDrawer" class="site-nav-drawer" aria-label="Mobile navigation">
        <a class="active" href="/select-event.html">Showtimes</a>
        <a href="/suggest">Suggest a Movie</a>
        <a href="/how-it-works">How It Works</a>
        <a href="/email-signup.html">Join Email List</a>
      </div>
    </nav>

    <h1>Showtimes</h1>
    <p class="subtitle" style="margin-bottom:12px;">Search your theater, then pick a screening to start voting.</p>

    <div class="flow-grid">
      <section class="info-box">
        <div class="step-header">
          <h2>1. Find your local theater</h2>
        </div>
        <div id="theaterSearchMount"></div>
      </section>

      <section id="calendarStep" class="info-box hidden">
        <div class="step-header">
          <h2>2. Choose a screening</h2>
          <p class="subtitle" id="calendarStepSubtitle" style="margin:4px 0 0;"></p>
        </div>
        <div id="calendarMount"></div>
      </section>

      <div id="petitionMount" class="hidden"></div>
    </div>

  </div>
</div>

<script src="/events-config.js?v=20260519-1"></script>
<script src="/site-nav.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, collection, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js";
  import { CalendarView, TheaterSearch, PetitionForm } from "/ui-components.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDMa_twNQAZVrnLHUNNNsxk6aTa-9FrnSc",
    authDomain: "reelconvo.firebaseapp.com",
    projectId: "reelconvo",
    storageBucket: "reelconvo.firebasestorage.app",
    messagingSenderId: "913820455359",
    appId: "1:913820455359:web:1c75954a231b921b55510a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const functions = getFunctions(app);
  const submitTheaterPetitionCallable = httpsCallable(functions, "submitTheaterPetition");
  const publicListTheatersCallable = httpsCallable(functions, "publicListTheaters");
  const reelSuccessListTheatersCallable = httpsCallable(functions, "reelSuccessListTheaters");

  const theaterSearchMount = document.getElementById("theaterSearchMount");
  const calendarStep = document.getElementById("calendarStep");
  const calendarMount = document.getElementById("calendarMount");
  const petitionMount = document.getElementById("petitionMount");
  const calendarStepSubtitle = document.getElementById("calendarStepSubtitle");

  function getEventSortTime(event) {
    const rawDateTime = String(event?.screeningDateTime || "").trim();
    const parsedDateTime = rawDateTime ? Date.parse(rawDateTime) : Number.NaN;
    if (Number.isFinite(parsedDateTime)) {
      return parsedDateTime;
    }

    const rawId = String(event?.id || event?.firestoreEventId || "").trim();
    const parsedId = rawId ? Date.parse(rawId) : Number.NaN;
    return Number.isFinite(parsedId) ? parsedId : Number.NEGATIVE_INFINITY;
  }

  async function loadMergedEvents() {
    const configuredEvents = Array.isArray(window.REELVOTES_EVENTS) ? window.REELVOTES_EVENTS : [];
    const mergedByFirestoreId = new Map();

    configuredEvents.forEach((event) => {
      const firestoreEventId = event.firestoreEventId || event.id;
      mergedByFirestoreId.set(firestoreEventId, {...event, firestoreEventId});
    });

    try {
      const snapshot = await getDocs(collection(db, "events"));
      snapshot.forEach((eventDoc) => {
        const eventData = eventDoc.data() || {};
        if (!eventData.screeningLabel && !eventData.screeningDateTime) {
          return;
        }

        const firestoreEventId = eventDoc.id;
        const existing = mergedByFirestoreId.get(firestoreEventId) || {};
        mergedByFirestoreId.set(firestoreEventId, {
          ...existing,
          id: existing.id || firestoreEventId,
          firestoreEventId,
          screeningLabel: eventData.screeningLabel || existing.screeningLabel || firestoreEventId,
          screeningDateTime: eventData.screeningDateTime || existing.screeningDateTime || "",
          voteStatus: String(eventData.voteStatus || existing.voteStatus || "not-started").trim().toLowerCase(),
          voteWindowLabel: eventData.voteWindowLabel || existing.voteWindowLabel || "",
          requireEmail: typeof eventData.requireEmail === "boolean" ? eventData.requireEmail : (existing.requireEmail !== false),
          showLiveVoteCounts: eventData.showLiveVoteCounts === true || existing.showLiveVoteCounts === true,
          theaterName: eventData.theaterName || existing.theaterName || "The New Parkway Theater",
          theaterCity: eventData.theaterCity || existing.theaterCity || "Oakland, CA",
          partnered: eventData.partnered !== false,
        });
      });
    } catch (error) {
      console.error("Could not load runtime events:", error);
    }

    return Array.from(mergedByFirestoreId.values()).sort((left, right) => getEventSortTime(left) - getEventSortTime(right));
  }

  function toLocalDateKey(screeningDateTime) {
    const rawValue = String(screeningDateTime || "").trim();
    if (!rawValue) return "";
    const isoMatch = rawValue.match(/^(\d{4}-\d{2}-\d{2})/);
    if (isoMatch) return isoMatch[1];
    const parsed = new Date(rawValue);
    if (Number.isNaN(parsed.getTime())) return "";
    const year = parsed.getFullYear();
    const month = String(parsed.getMonth() + 1).padStart(2, "0");
    const day = String(parsed.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function resolveStatus(runtimeStatus, configuredStatus) {
    const runtime = String(runtimeStatus || "").trim().toLowerCase();
    if (runtime === "live" || runtime === "ended") return runtime;
    const configured = String(configuredStatus || "").trim().toLowerCase();
    if (configured === "live" || configured === "ended") return configured;
    return "not-started";
  }

  async function hydrateEventStatuses(events) {
    return Promise.all(events.map(async (event) => {
      const firestoreEventId = event.firestoreEventId || event.id;
      try {
        const eventDoc = await getDoc(doc(db, "events", firestoreEventId));
        const eventData = eventDoc.exists() ? (eventDoc.data() || {}) : {};
        const status = resolveStatus(eventData.voteStatus, event.voteStatus);
        return { ...event, status };
      } catch {
        return { ...event, status: resolveStatus(null, event.voteStatus) };
      }
    }));
  }

  function buildTheaters(events) {
    const byKey = new Map();
    events.forEach((event) => {
      const theaterName = String(event.theaterName || "The New Parkway Theater").trim();
      const theaterCity = String(event.theaterCity || "Oakland, CA").trim();
      const key = `${theaterName.toLowerCase()}|${theaterCity.toLowerCase()}`;
      if (!byKey.has(key)) {
        byKey.set(key, {
          id: key.replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""),
          name: theaterName,
          city: theaterCity,
          partnered: event.partnered !== false,
        });
      }
    });

    if (!byKey.size) {
      byKey.set("new-parkway-oakland", {
        id: "new-parkway-oakland",
        name: "The New Parkway Theater",
        city: "Oakland, CA",
        partnered: true,
      });
    }

    return Array.from(byKey.values());
  }

  function slug(value) {
    return String(value || "")
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-|-$/g, "");
  }

  function navigateToVote(event) {
    const eventId = event.id;
    const nextUrl = new URL("/", window.location.origin);
    nextUrl.searchParams.set("event", eventId);
    window.sessionStorage.setItem("reelvotesSelectedEventId", eventId);
    window.location.href = nextUrl.toString();
  }

  function showPetitionForm(prefill = {}) {
    petitionMount.classList.remove("hidden");
    new PetitionForm({
      mountEl: petitionMount,
      prefill,
      onSubmit: async (payload) => {
        await submitTheaterPetitionCallable(payload);
      },
    });
  }

  const events = await loadMergedEvents();
  const eventsWithStatus = await hydrateEventStatuses(events);
  const theaters = buildTheaters(eventsWithStatus);
  const partneredTheaterKeys = new Set(
    theaters
      .filter((theater) => theater.partnered)
      .map((theater) => `${slug(theater.name)}|${slug(theater.city)}`)
  );

  async function queryTheaterSuggestions(query) {
    const trimmed = String(query || "").trim();
    try {
      let response = null;
      try {
        response = await publicListTheatersCallable({ query: trimmed, limit: trimmed ? 24 : 60 });
      } catch {
        response = await reelSuccessListTheatersCallable({ query: trimmed, limit: trimmed ? 24 : 60 });
      }
      const rows = Array.isArray(response?.data?.theaters) ? response.data.theaters : [];
      if (!rows.length && !trimmed) {
        return theaters;
      }

      const remoteTheaters = rows.map((row) => {
        const name = String(row?.theater_name || row?.theater_code || "Unknown Theater").trim();
        const city = String(row?.theater_city_state || row?.city || "").trim();
        const key = `${slug(name)}|${slug(city)}`;
        return {
          id: slug(row?.theater_key || `${name}-${city}`),
          name,
          city,
          partnered: partneredTheaterKeys.has(key),
        };
      });

      const merged = new Map();
      [...theaters, ...remoteTheaters].forEach((theater) => {
        const key = `${slug(theater.name)}|${slug(theater.city)}`;
        if (!key) return;
        merged.set(key, theater);
      });

      if (!trimmed) {
        return Array.from(merged.values());
      }

      const lowerQuery = trimmed.toLowerCase();
      return Array.from(merged.values()).filter((theater) => [theater.name, theater.city, theater.id]
        .map((value) => String(value || "").toLowerCase())
        .some((value) => value.includes(lowerQuery)));
    } catch {
      return theaters;
    }
  }

  let calendarView = null;

  const theaterSearch = new TheaterSearch({
    mountEl: theaterSearchMount,
    theaters,
    onQueryChange: queryTheaterSuggestions,
    onSelect: (theater) => {
      const matchedEvents = eventsWithStatus.filter((event) => {
        const eventName = String(event.theaterName || "The New Parkway Theater").trim().toLowerCase();
        const eventCity = String(event.theaterCity || "Oakland, CA").trim().toLowerCase();
        return eventName === theater.name.toLowerCase() && eventCity === theater.city.toLowerCase();
      });

      if (!theater.partnered) {
        calendarStep.classList.add("hidden");
        showPetitionForm({ theaterName: theater.name, city: theater.city });
        return;
      }

      petitionMount.classList.add("hidden");
      calendarStep.classList.remove("hidden");
      calendarStepSubtitle.textContent = `${theater.name} · ${theater.city}`;

      if (!calendarView) {
        calendarView = new CalendarView({
          mountEl: calendarMount,
          events: matchedEvents,
          onSelectDate: () => {},
          onSelectScreening: (event) => navigateToVote(event),
        });
      } else {
        calendarView.updateEvents(matchedEvents);
      }

      const firstDateKey = matchedEvents
        .map((event) => toLocalDateKey(event.screeningDateTime || event.id))
        .find(Boolean);

      if (firstDateKey) {
        calendarView.selectDate(firstDateKey);
      }
    },
  });

  const defaultTheater = theaters.find((theater) => String(theater.name || "").toLowerCase().includes("new parkway"))
    || theaters.find((theater) => theater.partnered)
    || theaters[0]
    || null;

  if (defaultTheater) {
    theaterSearch.selectedTheater = defaultTheater;
    theaterSearch.onSelect(defaultTheater);
    theaterSearch.render();
  }

</script>
</body>
</html>
