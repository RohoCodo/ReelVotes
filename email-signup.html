<!DOCTYPE html>
<html>
<head>
  <title>Join the Email List - ReelVotes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=/public/email-signup.html" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="icon.png" />
  <script>
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-MXXR4PXT');

    window.location.replace(`/public/email-signup.html${window.location.search || ""}${window.location.hash || ""}`);
  </script>
</head>
<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MXXR4PXT"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="overlay"></div>

<div class="container">
  <div class="card">

    <img src="icon.png" class="logo" />

    <h1>Get Voting Alerts Early</h1>
    <p class="subtitle">
      Drop your email and we'll let you know as soon as
      tickets for the next movie night go live.
    </p>

    <div class="email-step">
      <form id="emailForm">
        <label for="emailInput">Email address</label>
        <input
          id="emailInput"
          type="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
        <button id="emailSubmitBtn" type="submit" class="submit-btn">Join the email list</button>
      </form>
      <p id="emailStatus" class="email-help"></p>
    </div>

    <p class="track-results">
      <a href="index.html" class="app-link">Back to voting</a>
    </p>

  </div>
</div>

<script type="module" src="email-signup.js"></script>
</body>
</html>
