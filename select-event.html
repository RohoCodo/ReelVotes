<!DOCTYPE html>
<html>
<head>
  <title>Choose Showtime | ReelVotes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="icon.png" />
</head>
<body>

<div class="overlay"></div>

<div class="container">
  <div class="card">
    <div class="top-right-links" aria-label="Top links">
      <a href="admin.html" class="app-link">Admin View</a>
    </div>

    <img src="icon.png" class="logo" />

    <h1>Choose a Showtime</h1>

    <p class="subtitle">
      The New Parkway Theater
      <a href="https://www.thenewparkway.com" target="_blank">(website)</a>
    </p>

    <section class="theater-search-panel" aria-label="Find your theater">
      <h3>Find your theater</h3>
      <input id="theaterSearchInput" class="search-input" type="text" placeholder="Search theater, city, or code..." autocomplete="off" />
      <div id="theaterSearchResults" class="reelsuccess-search-results hidden" style="margin-top:8px;"></div>
      <p id="theaterSearchStatus" class="theater-search-status">Showing all upcoming and past showtimes.</p>
    </section>

    <div class="main-tabs" style="margin-top:18px;">
      <button id="liveShowsTabBtn" type="button" class="main-tab-btn active">Live Shows</button>
      <button id="historyShowsTabBtn" type="button" class="main-tab-btn">History</button>
    </div>

    <section id="liveShowsPanel" class="main-tab-panel" role="region" aria-label="Live shows">
      <div id="liveDateList" class="event-grid"></div>
    </section>

    <section id="historyShowsPanel" class="main-tab-panel" role="region" aria-label="Past shows" hidden>
      <div id="historyDateList" class="event-grid"></div>
    </section>

    <div style="margin-top:28px;text-align:center;">
      <button id="adminManageBtn" style="background:none;border:1px solid #444;color:#888;font-size:13px;padding:7px 16px;border-radius:8px;cursor:pointer;">⚙ Admin: Manage Events</button>
    </div>
  </div>
</div>

<!-- Admin modal -->
<div id="adminModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;overflow-y:auto;">
  <div style="background:#1a1a1a;border-radius:12px;max-width:480px;margin:40px auto;padding:28px 24px;position:relative;">
    <button id="adminModalClose" style="position:absolute;top:12px;right:14px;background:none;border:none;color:#aaa;font-size:22px;line-height:1;padding:0;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;">×</button>
    <h2 style="margin:0 0 6px;font-size:18px;">Manage Event</h2>
    <p style="color:#888;font-size:13px;margin:0 0 20px;">Select a showtime and set its ballot movies.</p>

    <label style="font-size:13px;color:#aaa;display:block;margin-bottom:6px;">Showtime</label>
    <select id="adminEventSelect" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid #444;background:#111;color:#fff;font-size:14px;margin-bottom:16px;"></select>

    <label style="font-size:13px;color:#aaa;display:block;margin-bottom:6px;">Vote requires email</label>
    <label style="display:flex;align-items:center;gap:8px;margin:0 0 14px;color:#ddd;font-size:14px;">
      <input id="adminRequireEmailCheckbox" type="checkbox" checked />
      Require a valid email to submit a vote
    </label>

    <label style="font-size:13px;color:#aaa;display:block;margin-bottom:6px;">Movies (one per line)</label>
    <textarea id="adminMoviesInput" rows="12" style="width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#111;color:#fff;font-size:14px;resize:vertical;box-sizing:border-box;font-family:inherit;"></textarea>
    <p style="font-size:12px;color:#666;margin:6px 0 16px;">Each line becomes a movie doc. Existing docs are updated; missing ones are removed.</p>

    <div id="adminSaveStatus" style="font-size:13px;color:#aaa;margin-bottom:12px;min-height:18px;"></div>

    <div style="display:flex;gap:10px;">
      <button id="adminSaveBtn" style="flex:1;padding:10px;background:#ff4757;border:none;border-radius:8px;color:#fff;font-size:15px;cursor:pointer;font-weight:600;">Save to Firestore</button>
      <button id="adminCancelBtn" style="padding:10px 18px;background:#333;border:none;border-radius:8px;color:#fff;font-size:15px;cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>

<script src="events-config.js?v=20260519-1"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, collection, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDMa_twNQAZVrnLHUNNNsxk6aTa-9FrnSc",
    authDomain: "reelconvo.firebaseapp.com",
    projectId: "reelconvo",
    storageBucket: "reelconvo.firebasestorage.app",
    messagingSenderId: "913820455359",
    appId: "1:913820455359:web:1c75954a231b921b55510a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const functions = getFunctions(app);
  const saveEventAdminSettingsCallable = httpsCallable(functions, "saveEventAdminSettings");
  const publicListTheatersCallable = httpsCallable(functions, "publicListTheaters");
  const reelSuccessListTheatersCallable = httpsCallable(functions, "reelSuccessListTheaters");

  function getEventSortTime(event) {
    const rawDateTime = String(event?.screeningDateTime || "").trim();
    const parsedDateTime = rawDateTime ? Date.parse(rawDateTime) : Number.NaN;
    if (Number.isFinite(parsedDateTime)) {
      return parsedDateTime;
    }

    const rawId = String(event?.id || event?.firestoreEventId || "").trim();
    const parsedId = rawId ? Date.parse(rawId) : Number.NaN;
    return Number.isFinite(parsedId) ? parsedId : Number.NEGATIVE_INFINITY;
  }

  async function loadMergedEvents() {
    const configuredEvents = Array.isArray(window.REELVOTES_EVENTS) ? window.REELVOTES_EVENTS : [];
    const mergedByFirestoreId = new Map();

    configuredEvents.forEach((event) => {
      const firestoreEventId = event.firestoreEventId || event.id;
      mergedByFirestoreId.set(firestoreEventId, {...event, firestoreEventId});
    });

    try {
      const snapshot = await getDocs(collection(db, "events"));
      snapshot.forEach((eventDoc) => {
        const eventData = eventDoc.data() || {};
        if (!eventData.screeningLabel && !eventData.screeningDateTime) {
          return;
        }

        const firestoreEventId = eventDoc.id;
        const existing = mergedByFirestoreId.get(firestoreEventId) || {};
        mergedByFirestoreId.set(firestoreEventId, {
          ...existing,
          id: existing.id || firestoreEventId,
          firestoreEventId,
          screeningLabel: eventData.screeningLabel || existing.screeningLabel || firestoreEventId,
          screeningDateTime: eventData.screeningDateTime || existing.screeningDateTime || "",
          voteStatus: String(eventData.voteStatus || existing.voteStatus || "not-started").trim().toLowerCase(),
          voteWindowLabel: eventData.voteWindowLabel || existing.voteWindowLabel || "",
          requireEmail: typeof eventData.requireEmail === "boolean" ? eventData.requireEmail : (existing.requireEmail !== false),
          showLiveVoteCounts: eventData.showLiveVoteCounts === true || existing.showLiveVoteCounts === true,
          theaterName: eventData.theaterName || existing.theaterName || "The New Parkway Theater",
          theaterCity: eventData.theaterCity || existing.theaterCity || "Oakland, CA",
          theaterCode: eventData.theaterCode || existing.theaterCode || "",
          theaterKey: eventData.theaterKey || existing.theaterKey || "",
          partnered: eventData.partnered !== false,
        });
      });
    } catch (error) {
      console.error("Could not load runtime events:", error);
    }

    return Array.from(mergedByFirestoreId.values()).sort((left, right) => getEventSortTime(left) - getEventSortTime(right));
  }

  const events = await loadMergedEvents();
  const liveDateList = document.getElementById("liveDateList");
  const historyDateList = document.getElementById("historyDateList");
  const liveShowsTabBtn = document.getElementById("liveShowsTabBtn");
  const historyShowsTabBtn = document.getElementById("historyShowsTabBtn");
  const liveShowsPanel = document.getElementById("liveShowsPanel");
  const historyShowsPanel = document.getElementById("historyShowsPanel");
  const theaterSearchInput = document.getElementById("theaterSearchInput");
  const theaterSearchResults = document.getElementById("theaterSearchResults");
  const theaterSearchStatus = document.getElementById("theaterSearchStatus");

  function setActiveTab(tabName) {
    const showLive = tabName === "live";
    if (liveShowsPanel) liveShowsPanel.hidden = !showLive;
    if (historyShowsPanel) historyShowsPanel.hidden = showLive;
    if (liveShowsTabBtn) liveShowsTabBtn.classList.toggle("active", showLive);
    if (historyShowsTabBtn) historyShowsTabBtn.classList.toggle("active", !showLive);
  }

  if (liveShowsTabBtn) liveShowsTabBtn.addEventListener("click", () => setActiveTab("live"));
  if (historyShowsTabBtn) historyShowsTabBtn.addEventListener("click", () => setActiveTab("history"));

  function toLocalDateKey(screeningDateTime) {
    const rawValue = String(screeningDateTime || "").trim();
    if (!rawValue) return "";
    const isoMatch = rawValue.match(/^(\d{4}-\d{2}-\d{2})/);
    if (isoMatch) {
      return isoMatch[1];
    }
    const parsed = new Date(rawValue);
    if (Number.isNaN(parsed.getTime())) {
      return "";
    }
    const year = parsed.getFullYear();
    const month = String(parsed.getMonth() + 1).padStart(2, "0");
    const day = String(parsed.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function isPastShow(event) {
    const eventDateKey = toLocalDateKey(event?.screeningDateTime);
    if (!eventDateKey) return false;

    const now = new Date();
    const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    return eventDateKey < todayKey;
  }

  function renderLoadingCards(listEl, items) {
    if (!listEl) return;
    listEl.innerHTML = items.map((event) => `
      <div class="event-card loading">
        <strong>${event.screeningLabel}</strong><br />
        <span>Checking voting status…</span>
      </div>
    `).join("");
  }

  const pastEvents = events.filter((event) => isPastShow(event));
  const liveEvents = events.filter((event) => !isPastShow(event));

  renderLoadingCards(liveDateList, liveEvents);
  renderLoadingCards(historyDateList, pastEvents);

  const eventsWithStatus = await Promise.all(
    events.map(async (event) => {
      const firestoreEventId = event.firestoreEventId || event.id;
      try {
        const eventDoc = await getDoc(doc(db, "events", firestoreEventId));
        const eventData = eventDoc.exists() ? (eventDoc.data() || {}) : {};
        const runtimeVoteStatus = String(eventData.voteStatus || "").trim().toLowerCase();
        if (runtimeVoteStatus === "live") {
          return { ...event, status: "live" };
        }
        if (runtimeVoteStatus === "ended") {
          return { ...event, status: "ended" };
        }

        if (event.voteStatus === "live") {
          return { ...event, status: "live" };
        }
        if (event.voteStatus === "ended") {
          return { ...event, status: "ended" };
        }
        if (event.voteStatus === "not-started") {
          return { ...event, status: "not-started" };
        }

        const moviesRef = collection(db, "events", firestoreEventId, "movies");
        const snapshot = await getDocs(moviesRef);
        return { ...event, status: snapshot.empty ? "not-started" : "live" };
      } catch (error) {
        console.error("Could not load voting status for", event.id, error);
        return { ...event, status: "not-started" };
      }
    })
  );

  const slug = (value) => String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");

  function theaterSignature(name, city) {
    return `${slug(name)}|${slug(city)}`;
  }

  function eventTheaterSignature(event) {
    return theaterSignature(event?.theaterName || "", event?.theaterCity || "");
  }

  function collectEventTheaters() {
    const byKey = new Map();
    eventsWithStatus.forEach((event) => {
      const name = String(event.theaterName || "The New Parkway Theater").trim();
      const city = String(event.theaterCity || "Oakland, CA").trim();
      const signature = theaterSignature(name, city);
      if (!signature || byKey.has(signature)) return;
      byKey.set(signature, {
        name,
        city,
        theaterCode: String(event.theaterCode || "").trim(),
        theaterKey: String(event.theaterKey || "").trim(),
        partnered: event.partnered !== false,
      });
    });
    return Array.from(byKey.values());
  }

  const eventTheaters = collectEventTheaters();
  let selectedTheaterSignature = "";
  let remoteSearchTimer = null;

  function setTheaterSearchStatus(message, isError = false) {
    if (!theaterSearchStatus) return;
    theaterSearchStatus.textContent = message || "";
    theaterSearchStatus.style.color = isError ? "#ff8e8e" : "#aaa";
  }

  function mapRemoteTheaterRow(row = {}) {
    const name = String(row?.theater_name || row?.theater_code || "Unknown Theater").trim();
    const city = String(row?.theater_city_state || row?.city || "").trim();
    return {
      name,
      city,
      theaterCode: String(row?.theater_code || "").trim(),
      theaterKey: String(row?.theater_key || "").trim(),
      partnered: eventTheaters.some((theater) => theaterSignature(theater.name, theater.city) === theaterSignature(name, city)),
    };
  }

  function renderTheaterResults(results = []) {
    if (!theaterSearchResults) return;
    if (!results.length) {
      theaterSearchResults.innerHTML = "";
      theaterSearchResults.classList.add("hidden");
      return;
    }

    theaterSearchResults.innerHTML = results.map((result) => {
      const signature = theaterSignature(result.name, result.city);
      const badge = result.partnered ? "Partnered" : "In network";
      return `
        <button type="button" class="reelsuccess-search-result-item" data-theater-signature="${signature}">
          <span>${result.name}${result.city ? ` · ${result.city}` : ""}</span>
          <span style="font-size:11px;color:#ffc2d8;">${badge}</span>
        </button>
      `;
    }).join("");

    theaterSearchResults.classList.remove("hidden");
  }

  function getFilteredEvents() {
    if (!selectedTheaterSignature) {
      return eventsWithStatus;
    }
    return eventsWithStatus.filter((event) => eventTheaterSignature(event) === selectedTheaterSignature);
  }

  function renderAllEventLists() {
    const filtered = getFilteredEvents();
    renderEventCards(filtered.filter((event) => !isPastShow(event)), liveDateList, "No upcoming showtimes");
    renderEventCards(filtered.filter((event) => isPastShow(event)), historyDateList, "No past showtimes");
  }

  function getDefaultTheaterSignature() {
    const preferred = eventTheaters.find((theater) => String(theater.name || "").toLowerCase().includes("new parkway"))
      || eventTheaters.find((theater) => theater.partnered)
      || eventTheaters[0]
      || null;
    return preferred ? theaterSignature(preferred.name, preferred.city) : "";
  }

  function applyTheaterSelection(signature) {
    selectedTheaterSignature = signature || "";
    renderAllEventLists();

    if (!signature) {
      setTheaterSearchStatus("Showing all upcoming and past showtimes.");
      return;
    }

    const count = getFilteredEvents().length;
    const selected = eventTheaters.find((theater) => theaterSignature(theater.name, theater.city) === signature);
    if (selected) {
      const suffix = count === 1 ? "showtime" : "showtimes";
      setTheaterSearchStatus(`Filtered to ${selected.name}${selected.city ? ` (${selected.city})` : ""} · ${count} ${suffix}.`);
      return;
    }

    setTheaterSearchStatus(count > 0 ? `Filtered results: ${count} showtimes.` : "No ReelVotes showtimes found for this theater yet.");
  }

  async function queryReelSuccessTheaters(query = "") {
    const payload = { query: String(query || "").trim(), limit: 40 };
    let response = null;
    try {
      response = await publicListTheatersCallable(payload);
    } catch {
      response = await reelSuccessListTheatersCallable(payload);
    }
    const rows = Array.isArray(response?.data?.theaters) ? response.data.theaters : [];
    return rows.map(mapRemoteTheaterRow);
  }

  async function refreshTheaterSearch(query = "") {
    const trimmed = String(query || "").trim();
    try {
      const remote = await queryReelSuccessTheaters(trimmed);
      const merged = new Map();
      [...eventTheaters, ...remote].forEach((theater) => {
        const signature = theaterSignature(theater.name, theater.city);
        if (!signature) return;
        merged.set(signature, theater);
      });

      const filtered = Array.from(merged.values()).filter((theater) => {
        if (!trimmed) return true;
        const haystack = [theater.name, theater.city, theater.theaterCode, theater.theaterKey]
          .map((value) => String(value || "").toLowerCase());
        return haystack.some((value) => value.includes(trimmed.toLowerCase()));
      });

      renderTheaterResults(filtered.slice(0, 24));
      if (!trimmed && !selectedTheaterSignature) {
        setTheaterSearchStatus("Showing all upcoming and past showtimes.");
      }
    } catch (error) {
      console.error("Failed to fetch theaters from ReelSuccess:", error);
      const fallback = eventTheaters.filter((theater) => {
        if (!trimmed) return true;
        return theaterSignature(theater.name, theater.city).includes(slug(trimmed));
      });
      renderTheaterResults(fallback.slice(0, 24));
      setTheaterSearchStatus("Could not refresh remote theaters right now. Showing local showtime theaters.", true);
    }
  }

  function renderEventCards(items, listEl, emptyMessage) {
    if (!listEl) return;
    if (!items.length) {
      listEl.innerHTML = `
        <div class="event-card disabled" aria-disabled="true">
          <strong>${emptyMessage}</strong><br />
          <span>No showtimes in this section yet</span>
        </div>
      `;
      return;
    }

    listEl.innerHTML = items.map((event) => {
      const queryEventId = event.id;
      const nextHref = `/?event=${encodeURIComponent(queryEventId)}`;
      if (event.status === "ended") {
        return `
          <a class="event-card event-card-ended" data-event-id="${queryEventId}" href="${nextHref}">
            <strong>${event.screeningLabel}</strong><br />
            <span>Voting has ended · View results</span>
          </a>
        `;
      }

      if (event.status !== "live") {
        return `
          <div class="event-card disabled" aria-disabled="true">
            <strong>${event.screeningLabel}</strong><br />
            <span>Voting has not started</span>
          </div>
        `;
      }

      return `
        <a class="event-card" data-event-id="${queryEventId}" href="${nextHref}">
          <strong>${event.screeningLabel}</strong><br />
          <span>Voting now</span>
        </a>
      `;
    }).join("");
  }

  renderAllEventLists();

  theaterSearchInput?.addEventListener("input", (event) => {
    const value = event.target instanceof HTMLInputElement ? event.target.value : "";
    selectedTheaterSignature = "";
    renderAllEventLists();
    setTheaterSearchStatus(value.trim() ? "Searching all ReelSuccess theaters…" : "Showing all upcoming and past showtimes.");

    if (remoteSearchTimer) {
      clearTimeout(remoteSearchTimer);
    }
    remoteSearchTimer = setTimeout(() => {
      refreshTheaterSearch(value);
    }, 180);
  });

  theaterSearchResults?.addEventListener("click", (event) => {
    const target = event.target instanceof Element ? event.target : null;
    const button = target?.closest("[data-theater-signature]");
    if (!button) return;

    const signature = button.getAttribute("data-theater-signature") || "";
    if (!signature) return;

    const match = eventTheaters.find((theater) => theaterSignature(theater.name, theater.city) === signature);
    if (theaterSearchInput && match) {
      theaterSearchInput.value = `${match.name}${match.city ? ` · ${match.city}` : ""}`;
    }

    theaterSearchResults.classList.add("hidden");
    applyTheaterSelection(signature);
  });

  theaterSearchInput?.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      theaterSearchResults?.classList.add("hidden");
      theaterSearchInput.blur();
    }
  });

  document.addEventListener("click", (event) => {
    const target = event.target instanceof Element ? event.target : null;
    if (!target) return;
    if (target.closest("#theaterSearchInput") || target.closest("#theaterSearchResults")) {
      return;
    }
    theaterSearchResults?.classList.add("hidden");
  });

  await refreshTheaterSearch("");

  const defaultTheaterSignature = getDefaultTheaterSignature();
  if (defaultTheaterSignature) {
    const match = eventTheaters.find((theater) => theaterSignature(theater.name, theater.city) === defaultTheaterSignature);
    if (theaterSearchInput && match) {
      theaterSearchInput.value = `${match.name}${match.city ? ` · ${match.city}` : ""}`;
    }
    applyTheaterSelection(defaultTheaterSignature);
  }

  [liveDateList, historyDateList].forEach((listEl) => listEl?.addEventListener("click", (event) => {
    const origin = event.target instanceof Element ? event.target : null;
    const card = origin?.closest("[data-event-id]");
    if (!card) {
      return;
    }

    const eventId = card.dataset.eventId;
    const nextUrl = new URL("/", window.location.origin);
    nextUrl.searchParams.set("event", eventId);

    window.sessionStorage.setItem("reelvotesSelectedEventId", eventId);
    event.preventDefault();
    window.location.href = nextUrl.toString();
  }));

  // ── Admin modal ──────────────────────────────────────────────────────────
  const ADMIN_EMAILS = new Set([
    "rt332@cornell.edu",
    "moses@thenewparkway.com",
    "programming@thenewparkway.com",
    "nikki@thenewparkwaytheater.com"
  ]);
  const ADMIN_STORAGE_KEY = "reelvotes_admin_email";
  const EVENT_ID_ALIASES = { "2026-04-27": "newparkway1" };

  const adminModal       = document.getElementById("adminModal");
  const adminEventSelect = document.getElementById("adminEventSelect");
  const adminRequireEmailCheckbox = document.getElementById("adminRequireEmailCheckbox");
  const adminMoviesInput = document.getElementById("adminMoviesInput");
  const adminSaveStatus  = document.getElementById("adminSaveStatus");
  const adminSaveBtn     = document.getElementById("adminSaveBtn");
  const adminCancelBtn   = document.getElementById("adminCancelBtn");
  const adminModalClose  = document.getElementById("adminModalClose");

  function normalizeEmail(e) { return (e || "").trim().toLowerCase(); }

  async function ensureAdminEmail() {
    const stored = localStorage.getItem(ADMIN_STORAGE_KEY);
    if (stored && ADMIN_EMAILS.has(normalizeEmail(stored))) return stored;
    const input = window.prompt("Admin access only. Enter your theater email:");
    const email = normalizeEmail(input);
    if (!email || !ADMIN_EMAILS.has(email)) {
      alert("Access denied.");
      return null;
    }
    localStorage.setItem(ADMIN_STORAGE_KEY, email);
    return email;
  }

  // Populate event dropdown
  function populateAdminSelect() {
    adminEventSelect.innerHTML = events.map(ev =>
      `<option value="${ev.id}">${ev.screeningLabel || ev.id}</option>`
    ).join("");
  }

  // Load existing movies for selected event into textarea
  async function loadMoviesForEvent(eventId) {
    const firestoreId = EVENT_ID_ALIASES[eventId]
      || events.find(e => e.id === eventId)?.firestoreEventId
      || eventId;
    const configuredRequireEmail = events.find(e => e.id === eventId)?.requireEmail !== false;
    adminSaveStatus.textContent = "Loading…";
    try {
      const snap = await getDocs(collection(db, "events", firestoreId, "movies"));
      const eventDoc = await getDoc(doc(db, "events", firestoreId));
      const titles = [];
      snap.forEach(d => titles.push(d.data().movie_title || d.id));
      titles.sort();
      adminMoviesInput.value = titles.join("\n");
      const eventData = eventDoc.exists() ? (eventDoc.data() || {}) : {};
      adminRequireEmailCheckbox.checked = typeof eventData.requireEmail === "boolean"
        ? eventData.requireEmail
        : configuredRequireEmail;
      adminSaveStatus.textContent = snap.empty ? "No movies yet — add some below." : `Loaded ${titles.length} movies.`;
    } catch (e) {
      adminSaveStatus.textContent = "Could not load existing movies.";
      adminMoviesInput.value = "";
      adminRequireEmailCheckbox.checked = configuredRequireEmail;
    }
  }

  // Save movies to Firestore
  async function saveMovies() {
    const eventId = adminEventSelect.value;
    const firestoreId = EVENT_ID_ALIASES[eventId]
      || events.find(e => e.id === eventId)?.firestoreEventId
      || eventId;

    const titles = adminMoviesInput.value
      .split("\n")
      .map(t => t.trim())
      .filter(Boolean);

    if (titles.length === 0) {
      adminSaveStatus.textContent = "⚠ No movies entered.";
      return;
    }

    adminSaveBtn.disabled = true;
    adminSaveStatus.textContent = "Saving…";

    const adminEmail = localStorage.getItem(ADMIN_STORAGE_KEY);
    try {
      await saveEventAdminSettingsCallable({
        eventId: firestoreId,
        adminEmail,
        requireEmail: adminRequireEmailCheckbox.checked,
        movieTitles: titles,
      });
      await loadMoviesForEvent(eventId);
      adminSaveStatus.textContent = `✓ Saved ${titles.length} movies. Email required: ${adminRequireEmailCheckbox.checked ? "on" : "off"}.`;
    } catch (err) {
      console.error("Save failed:", err);
      adminSaveStatus.textContent = `✗ Error: ${err.message}`;
    }
    adminSaveBtn.disabled = false;
  }

  // Wire up buttons
  document.getElementById("adminManageBtn").addEventListener("click", async () => {
    const email = await ensureAdminEmail();
    if (!email) return;
    populateAdminSelect();
    adminModal.style.display = "block";
    await loadMoviesForEvent(adminEventSelect.value);
  });

  adminEventSelect.addEventListener("change", () => loadMoviesForEvent(adminEventSelect.value));
  adminSaveBtn.addEventListener("click", saveMovies);
  adminCancelBtn.addEventListener("click", () => { adminModal.style.display = "none"; });
  adminModalClose.addEventListener("click", () => { adminModal.style.display = "none"; });
  adminModal.addEventListener("click", (e) => { if (e.target === adminModal) adminModal.style.display = "none"; });
</script>
</body>
</html>
